<script>
  (function() {
    try {
      var saved = localStorage.getItem('dagat-theme');
      var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      var theme = saved || (prefersLight ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<style>
:root {
  --brand-fire: #ff5722;
  --brand-fire-glow: rgba(255, 87, 34, 0.45);
  --brand-amber: #f59e0b;
  --brand-gold: #eab308;
  --brand-gold-glow: rgba(234, 179, 8, 0.45);
  --brand-cyan: #06b6d4;
  --brand-emerald: #10b981;
  --brand-danger: #ef4444;

  --bg: #060919;
  --bg-surface: #0b1029;
  --bg-card: rgba(255, 255, 255, 0.035);
  --bg-card-hover: rgba(255, 255, 255, 0.07);
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.18);
  --border-gold: rgba(234, 179, 8, 0.35);
  --border-fire: rgba(255, 87, 34, 0.35);

  --text: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;

  --gradient-cyber: radial-gradient(ellipse at 15% 15%, #1e1338 0%, transparent 50%),
                    radial-gradient(ellipse at 85% 20%, #0d274c 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 90%, #201026 0%, transparent 55%);
  --gradient-fire: linear-gradient(135deg, #ff5722 0%, #ff8a50 50%, #ff5722 100%);
  --gradient-gold: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.8);

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 24px;
  --max-w: 1280px;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition: 0.28s cubic-bezier(0.16, 1, 0.3, 1);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --nav-h: 64px;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --bg-surface: #ffffff;
  --bg-card: rgba(0, 0, 0, 0.03);
  --bg-card-hover: rgba(0, 0, 0, 0.06);
  --border: rgba(0, 0, 0, 0.09);
  --border-strong: rgba(0, 0, 0, 0.18);
  --border-gold: rgba(180, 83, 9, 0.4);
  --border-fire: rgba(234, 88, 12, 0.4);
  --text: #090d24;
  --text-muted: #475569;
  --text-dim: #94a3b8;
  --gradient-cyber: radial-gradient(ellipse at 15% 15%, #ffedd5 0%, transparent 50%),
                    radial-gradient(ellipse at 85% 20%, #e0e7ff 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 90%, #fef3c7 0%, transparent 55%);
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + var(--safe-top) + 16px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}

html, body { max-width: 100vw; overflow-x: hidden; }
img, svg, video, iframe { max-width: 100%; height: auto; display: block; }
input, select, textarea, button { font-family: inherit; font-size: 16px; }

h1, h2, h3, h4, h5 {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.15;
  overflow-wrap: break-word;
  word-break: break-word;
}

::selection { background: var(--brand-fire); color: white; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--brand-fire), var(--brand-gold));
  border-radius: 8px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
  animation: gridShift 60s linear infinite;
}

@keyframes gridShift {
  from { background-position: 0 0; }
  to { background-position: 60px 60px; }
}

[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
}

.skip-link {
  position: absolute;
  top: -100px;
  left: 12px;
  padding: 10px 16px;
  background: var(--brand-fire);
  color: white;
  border-radius: var(--radius-sm);
  z-index: 100000;
  font-weight: 600;
  text-decoration: none;
}
.skip-link:focus { top: 12px; }

.hidden { display: none !important; }

.nav-shell {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  padding: calc(8px + var(--safe-top)) 16px 8px;
  background: rgba(6, 9, 25, 0.88);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  transition: padding 0.3s ease;
}

[data-theme="light"] .nav-shell {
  background: rgba(255, 255, 255, 0.92);
}

.nav-container {
  max-width: var(--max-w);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.nav-brand-group {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  flex-shrink: 0;
  min-width: 0;
}

.nav-logo-img {
  height: 40px;
  width: auto;
  filter: drop-shadow(0 4px 14px rgba(255, 87, 34, 0.4));
  flex-shrink: 0;
}

.nav-brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.nav-brand-text .main-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.nav-brand-text .main-title .dot {
  width: 6px; height: 6px;
  background: var(--brand-fire);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--brand-fire);
  animation: pulseBeacon 2s infinite;
}

.nav-brand-text .sub-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

@keyframes pulseBeacon {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.4); }
}

.nav-tabs-desktop {
  display: none;
  align-items: center;
  gap: 3px;
  flex-wrap: wrap;
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.nav-drawer {
  position: fixed;
  top: 0; right: -100%;
  width: 85%;
  max-width: 360px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-strong);
  z-index: 1001;
  padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
  overflow-y: auto;
  transition: right 0.35s var(--ease-out);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-drawer.open { right: 0; }

.nav-drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.nav-drawer-header h3 {
  font-size: 1rem;
  color: var(--text);
}

.nav-drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.nav-drawer-backdrop.open {
  opacity: 1;
  pointer-events: all;
}

.nav-drawer .nav-tab-link {
  width: 100%;
  justify-content: flex-start;
  padding: 14px 16px;
  font-size: 0.95rem;
  border-radius: 12px;
  min-height: 48px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  min-height: 44px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.2s var(--ease-out), box-shadow 0.2s ease, background 0.2s ease;
  white-space: nowrap;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  user-select: none;
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.3), transparent 60%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

.btn:active { transform: scale(0.97); }
.btn:active::after { opacity: 1; transition: none; }

.btn:focus-visible {
  outline: 2px solid var(--brand-fire);
  outline-offset: 2px;
}

.btn-fire {
  background: var(--gradient-fire);
  background-size: 200% 200%;
  color: #fff;
  box-shadow: 0 6px 20px -4px var(--brand-fire-glow);
}
.btn-fire:hover { box-shadow: 0 10px 28px -4px var(--brand-fire-glow); background-position: 100% 0; }

.btn-law {
  background: var(--gradient-gold);
  background-size: 200% 200%;
  color: #000;
  font-weight: 700;
  box-shadow: 0 6px 20px -4px var(--brand-gold-glow);
}
.btn-law:hover { box-shadow: 0 10px 28px -4px var(--brand-gold-glow); background-position: 100% 0; }

.btn-ghost {
  background: var(--bg-card);
  border-color: var(--border-strong);
  color: var(--text);
  backdrop-filter: blur(10px);
}
.btn-ghost:hover { background: var(--bg-card-hover); border-color: var(--brand-fire); }

.btn-danger {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  color: #fff;
}
.btn-danger:hover { box-shadow: 0 10px 28px -4px rgba(220,38,38,0.5); }

.btn-sm { padding: 8px 14px; font-size: 0.8rem; min-height: 36px; border-radius: 8px; }
.btn-lg { padding: 14px 24px; font-size: 1rem; min-height: 52px; border-radius: 14px; }
.btn-block { width: 100%; }

.icon-btn {
  width: 44px; height: 44px;
  min-width: 44px;
  border-radius: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg-card-hover); color: var(--text); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn:focus-visible { outline: 2px solid var(--brand-fire); outline-offset: 2px; }

.nav-tab-link {
  font-size: 0.82rem;
  font-weight: 600;
  padding: 8px 11px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  text-decoration: none;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: 1px solid transparent;
  font-family: inherit;
}

.nav-tab-link:hover {
  color: var(--text);
  background: var(--bg-card-hover);
}

.nav-tab-link.active {
  color: #fff;
  background: rgba(255, 87, 34, 0.15);
  border-color: var(--border-fire);
}

[data-theme="light"] .nav-tab-link.active {
  color: var(--brand-fire);
  background: rgba(255, 87, 34, 0.1);
}

.nav-tab-link.law-tab.active {
  color: var(--brand-gold);
  background: rgba(234, 179, 8, 0.15);
  border-color: var(--border-gold);
}

.hero-stage {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(90px + var(--safe-top)) 16px 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--gradient-cyber);
  overflow: hidden;
}

.monumental-logo-wrapper {
  position: relative;
  width: clamp(160px, 42vw, 280px);
  height: clamp(160px, 42vw, 280px);
  margin: 0 auto 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbital-ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.orbital-ring.ring-inner {
  inset: -12px;
  border: 1px dashed rgba(255, 87, 34, 0.45);
  animation: rotateClockwise 24s linear infinite;
}

.orbital-ring.ring-middle {
  inset: -25px;
  border: 1px solid rgba(234, 179, 8, 0.25);
  border-top-color: var(--brand-gold);
  border-bottom-color: var(--brand-fire);
  animation: rotateCounter 36s linear infinite;
}

.orbital-ring.ring-outer {
  inset: -42px;
  border: 1px dotted rgba(99, 102, 241, 0.3);
  animation: rotateClockwise 48s linear infinite;
}

.orbital-glow-core {
  position: absolute;
  inset: -15px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 87, 34, 0.4) 0%,
    rgba(234, 179, 8, 0.22) 40%,
    rgba(99, 102, 241, 0.12) 65%,
    transparent 80%);
  filter: blur(30px);
  animation: volumetricPulse 5s ease-in-out infinite;
  z-index: 1;
}

.monumental-logo-img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 15px 40px rgba(255, 87, 34, 0.45));
  animation: heroFloat 6s ease-in-out infinite;
}

@keyframes rotateClockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes rotateCounter { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
@keyframes volumetricPulse {
  0%, 100% { opacity: 0.8; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.06); }
}
@keyframes heroFloat {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}

.sheet-view {
  display: none;
  min-height: calc(100vh - var(--nav-h));
  min-height: calc(100dvh - var(--nav-h));
  padding: calc(90px + var(--safe-top)) 16px 60px;
  position: relative;
  z-index: 1;
}

.sheet-view.active {
  display: block;
  animation: sheetFadeIn 0.4s var(--ease-out);
}

@keyframes sheetFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.sheet-container { max-width: var(--max-w); margin: 0 auto; }

.sheet-breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.sheet-breadcrumb a {
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s;
}
.sheet-breadcrumb a:hover { color: var(--brand-fire); }
.sheet-breadcrumb .current { color: var(--brand-amber); font-weight: 600; }

.sheet-header {
  max-width: 720px;
  margin: 0 auto 40px;
  text-align: center;
}

.sheet-tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 4px 12px;
  border-radius: 100px;
  margin-bottom: 12px;
  background: rgba(255, 87, 34, 0.12);
  color: var(--brand-fire);
  border: 1px solid var(--border-fire);
}

.sheet-tag.gold {
  background: rgba(234, 179, 8, 0.15);
  color: var(--brand-gold);
  border-color: var(--border-gold);
}

.sheet-title {
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  margin-bottom: 12px;
  overflow-wrap: break-word;
}

.sheet-desc {
  font-size: clamp(0.9rem, 2.4vw, 1.05rem);
  color: var(--text-muted);
  line-height: 1.6;
}

/* ═══════════════════════════════════════════════════════
   SERVICE CARDS — Diseño premium con imagen + overlay
   ═══════════════════════════════════════════════════════ */
.service-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

@media (min-width: 768px) {
  .service-cards {
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
}

.service-card {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out), border-color 0.3s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  min-height: 380px;
}

.service-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}

.service-card.fire:hover { border-color: var(--brand-fire); }
.service-card.gold:hover { border-color: var(--brand-gold); }
.service-card.cyan:hover { border-color: var(--brand-cyan); }

.service-card-media {
  position: relative;
  height: 200px;
  overflow: hidden;
  background: #090e24;
  flex-shrink: 0;
}

.service-card-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s var(--ease-out);
  filter: saturate(0.85) contrast(1.05);
}

.service-card:hover .service-card-media img {
  transform: scale(1.08);
  filter: saturate(1) contrast(1.1);
}

.service-card-media::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 0%, rgba(6, 9, 25, 0.6) 70%, var(--bg-surface) 100%);
  pointer-events: none;
}

.service-card.fire .service-card-media::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 87, 34, 0.35), transparent 60%);
  z-index: 1;
  pointer-events: none;
  mix-blend-mode: overlay;
}

.service-card.gold .service-card-media::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(234, 179, 8, 0.35), transparent 60%);
  z-index: 1;
  pointer-events: none;
  mix-blend-mode: overlay;
}

.service-card.cyan .service-card-media::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.35), transparent 60%);
  z-index: 1;
  pointer-events: none;
  mix-blend-mode: overlay;

/* Campus Virtual Grid */
.campus-grid-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

.app-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);

}

.app-modal-box {

.app-modal.active .app-modal-box { transform: translateY(0); }

.app-modal-box.gold-box { border-color: var(--border-gold); }

.modal-handle {

.toast-container {

  right: 16px;

  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);

.skeleton {

  height: 14px;
  margin: 8px 0;
}

@keyframes skeletonShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.spinner {

  height: 20px;

@keyframes spin { to { transform: rotate(360deg); } }

.reveal {

.reveal.visible {
